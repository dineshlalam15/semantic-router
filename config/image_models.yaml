# Image model registry for production semantic routing.
# Providers: OpenAI, Gemini, LiteLLM.
# Capabilities represent intrinsic model potentials, architectural strengths, and rendering competencies.
# Free of specific photography scenes, scenarios, and industry-specific entities.

models:
  - provider: "OpenAI"
    model_name: "gpt-image-2.5"
    domains:
      - "creative_and_photorealistic_image"
      - "diagram_and_infographic_image"
      - "print_and_typography_image"
      - "product_and_brand_image"
      - "safety_and_claims_review"
    capabilities:
      - "in-image typography and legible text rendering"
      - "high-density alphanumeric character rendering"
      - "complex multi-element layout and compositional structuring"
      - "photorealistic human synthesis with accurate complexion and undertones"
      - "multi-instruction prompt adherence and detail alignment"
      - "annotated diagrammatic layout and visual structuring"
      - "editorial layout combining imagery typography and brand elements"
      - "multi-tone comparative swatches and pigment representation"
    metadata:
      modality: "image"
      cost_per_image: 0.07
      avg_latency_ms: 4500


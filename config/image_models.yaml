# Image Models Configuration: Best-in-market models for marketing visual production and design collateral.
# Providers: OpenAI, Gemini, LiteLLM, Firefly.
# Note: Anthropic provides text/multimodal reasoning models but does not offer native image generation models.
# Metadata: cost (USD per image), avg_latency_ms.

models:

  # DALL-E 3 was officially replaced by GPT Image in ChatGPT/API (OpenAI, March 2025)
  - provider: "OpenAI"
    model_name: "gpt-image-1"
    domains:
      - "commercial_visual_production"
      - "marketing_collateral_and_layout"
    capabilities:
      - "photorealism"
      - "creative_art_styles"
      - "prompt_following"
      - "commercial_hero_shots"
    metadata:
      cost_per_image: 0.07
      avg_latency_ms: 4500
      context_window_k: null


  # "Nano Banana Pro" - Gemini's current flagship native image model (replaces Imagen 3/4 line)
  - provider: "Gemini"
    model_name: "gemini-3-pro-image"
    domains:
      - "commercial_visual_production"
      - "marketing_collateral_and_layout"
    capabilities:
      - "high_fidelity_photorealism"
      - "crisp_text_rendering"
      - "e-commerce_pack_shots"
      - "diverse_representation"
    metadata:
      cost_per_image: 0.04
      avg_latency_ms: 4000
      context_window_k: null


  - provider: "LiteLLM"
    model_name: "flux-1.1-pro"
    domains:
      - "commercial_visual_production"
      - "marketing_collateral_and_layout"
    capabilities:
      - "state_of_the_art_photorealism"
      - "fine_typography_in_images"
      - "commercial_product_renders"
      - "open_weights_customizable"
    metadata:
      cost_per_image: 0.03
      avg_latency_ms: 4000
      context_window_k: null

  # Could not verify a newer Stability AI flagship release beyond 3.5 Large at time
  # of writing; re-check stability.ai/news before assuming current.
  - provider: "LiteLLM"
    model_name: "stable-diffusion-3-5-large"
    domains:
      - "commercial_visual_production"
    capabilities:
      - "creative_art_styles"
      - "open_weights"
      - "fine_tunable"
      - "cinematic_backgrounds"
    metadata:
      cost_per_image: 0.01
      avg_latency_ms: 6500
      context_window_k: null


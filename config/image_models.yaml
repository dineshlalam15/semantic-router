# Image Models Configuration
# Best-in-market LLM models for image generation.
# Providers: Anthropic, OpenAI, Gemini, LiteLLM + Firefly (for automotive & pharma visuals).
# Note: Anthropic has no image generation model and is excluded from this file.
# Metadata: cost (USD per image or per 1K tokens), avg_latency_ms.
# Note: This file is for reference and future use. The active router reads models.yaml.

models:

  # ── Adobe Firefly ────────────────────────────────────────────────────────────
  # Best-in-class for brand-safe, commercially licensed, regulated-industry image generation.
  - provider: "Firefly"
    model_name: "firefly-image-3"
    domains:
      - "automotive_visual_production"
      - "pharma_visual_design"
      - "image_generation"
    capabilities:
      - "photorealism"
      - "brand_safe_generation"
      - "campaign_quality"
      - "regulatory_compliant_imagery"
    metadata:
      cost_per_image: 0.04
      avg_latency_ms: 4500
      context_window_k: null

  - provider: "Firefly"
    model_name: "firefly-vector"
    domains:
      - "automotive_visual_production"
      - "pharma_visual_design"
    capabilities:
      - "vector_art"
      - "logo_design"
      - "icon_illustration"
      - "infographic_generation"
    metadata:
      cost_per_image: 0.02
      avg_latency_ms: 3000
      context_window_k: null

  # ── OpenAI ──────────────────────────────────────────────────────────────────
  - provider: "OpenAI"
    model_name: "dall-e-3"
    domains:
      - "image_generation"
      - "automotive_visual_production"
      - "pharma_visual_design"
    capabilities:
      - "photorealism"
      - "creative_art_styles"
      - "prompt_following"
    metadata:
      cost_per_image: 0.08
      avg_latency_ms: 5000
      context_window_k: null

  # ── Gemini ──────────────────────────────────────────────────────────────────
  - provider: "Gemini"
    model_name: "imagen-3"
    domains:
      - "image_generation"
      - "automotive_visual_production"
      - "pharma_visual_design"
    capabilities:
      - "photorealism"
      - "high_fidelity_rendering"
      - "diverse_representation"
    metadata:
      cost_per_image: 0.04
      avg_latency_ms: 4000
      context_window_k: null

  # ── LiteLLM ─────────────────────────────────────────────────────────────────
  # Access to open-weights image models via LiteLLM proxy gateway.
  - provider: "LiteLLM"
    model_name: "stable-diffusion-3-5-large"
    domains:
      - "image_generation"
    capabilities:
      - "creative_art_styles"
      - "open_weights"
      - "fine_tunable"
    metadata:
      cost_per_image: 0.01
      avg_latency_ms: 6500
      context_window_k: null

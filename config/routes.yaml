# Semantic routes and generic intent utterances.

routes:

  - name: "commercial_visual_production"
    description: "Photorealistic and cinematic commercial image generation including campaign hero visuals, studio product renders, digital billboards, and retail displays."
    priority: 10
    utterances:
      - "Render a cinematic hero image with controlled lighting, strong composition, and space for a headline."
      - "Generate a studio-quality product render with accurate materials, soft shadows, and a clean background."
      - "Create a dramatic campaign visual with a bold focal subject, atmospheric lighting, and room for brand messaging."
      - "Produce an authentic lifestyle image showing people using a product in a natural everyday setting."
      - "Design a photorealistic outdoor campaign image with dynamic perspective, environmental depth, and polished lighting."
      - "Render a detailed close-up highlighting material texture, finish quality, and precise product construction."
      - "Generate a visual comparison of several product variants with consistent framing and clear feature callouts."
      - "Create a premium tabletop composition with directional light, tactile surfaces, and carefully arranged objects."
      - "Render an architectural interior scene with contemporary styling, natural daylight, and atmospheric depth."
      - "Generate a photorealistic landscape hero image with a calm atmosphere and aspirational visual treatment."

  - name: "marketing_collateral_and_layout"
    description: "Commercial marketing design assets including product packaging, lifestyle imagery, technical infographics, banners, and multi-panel print and digital layouts."
    priority: 10
    utterances:
      - "Generate a polished marketing visual on a clean background with accurate colors and sharp presentation."
      - "Create an authentic lifestyle image with warm natural lighting, candid expression, and diverse representation."
      - "Design a clean technical architecture or workflow diagram with clear hierarchy and labeled relationships."
      - "Produce a wide promotional banner with headline space, supporting message area, and footer placement."
      - "Generate an editorial layout combining imagery, structured typography, captions, and supporting callouts."
      - "Illustrate a performance infographic with labeled axes, data annotations, and an accessible visual hierarchy."
      - "Create a multi-panel brochure layout with a cover, explanatory content, process steps, and contact information."
      - "Design a digital display layout with strong contrast, concise messaging, and a high-visibility call to action."
      - "Produce a lifecycle infographic showing sequential stages with consistent icons and clear directional flow."
      - "Design a high-fidelity dashboard interface with navigation, summary metrics, charts, and structured data tables."
      - "Create a poster layout with headline hierarchy, date information, supporting details, and reserved logo areas."

  - name: "packaging_and_on_pack_copy"
    description: "Packaging design direction, brand claim writing, structure and hierarchy for retail packaging, back-of-pack storytelling, ingredient disclosures, QR calls to action, and consumer-safe claims copy."
    priority: 10
    utterances:
      - "Write complete on-pack copy including product name, tagline, front claim, back story, ingredients, warnings, recycling text, and a QR call to action."
      - "Create a pack-shot brief with material direction, product arrangement, visual accents, and clean studio lighting."
      - "Draft concise front-of-pack claims that are clear, benefit-led, readable, and suitable for compliance review."
      - "Design a packaging brief covering information hierarchy, tone, claims, copy blocks, and visual system."
      - "Write a compliant back-of-pack explanation with usage guidance, required disclosures, and placeholder information fields."
      - "Create copy variants for several package sizes while preserving terminology, hierarchy, and brand voice."

  - name: "brand_refresh_and_identity_guidelines"
    description: "Brand refresh direction, identity systems, campaign style guidance, visual language standards, and tone-of-voice frameworks."
    priority: 9
    utterances:
      - "Create a professional brand refresh concept without assuming a specific industry, audience, format, or visual asset."
      - "Develop a refreshed identity direction covering logo treatment, typography, color, layout, imagery, and tone."
      - "Write identity guidelines for a modern brand with principles for visual consistency and inclusive communication."
      - "Create a brand manifesto and visual language framework with a distinctive, contemporary, and memorable voice."
      - "Draft a brand refresh brief with moodboard direction, typography guidance, messaging principles, and example applications."
      - "Define a flexible design system that can scale across digital, print, social, and presentation formats."

  - name: "travel_and_hospitality_marketing"
    description: "Destination, accommodation, experience, and hospitality marketing content including visual storytelling, guides, listings, and re-engagement campaigns."
    priority: 9
    utterances:
      - "Generate an aspirational hero image with serene lighting, an inviting atmosphere, and no people."
      - "Write a detailed guide with an introduction, notable places, recommendations, timing, and practical advice."
      - "Design a multi-email re-engagement campaign with emotional hooks, visual direction, and a time-sensitive offer."
      - "Create a premium experience marketing concept emphasizing atmosphere, comfort, service, and conversion intent."
      - "Draft a listing description highlighting light, layout, surroundings, features, and transparent image disclosures."
      - "Write experience-focused copy in a conversational but authoritative tone with search-friendly structure and practical details."

  - name: "real_estate_listing_and_staging"
    description: "Property listing descriptions, virtual staging prompts, interior style direction, and sale-ready property collateral with transparent disclosures."
    priority: 9
    utterances:
      - "Virtually stage an empty space in a defined interior style and write a concise listing description."
      - "Create a polished listing highlighting natural light, layout, condition, features, and nearby amenities."
      - "Write a marketing brief with styling direction, photography prompts, and copy requirements."
      - "Compose a transparent listing narrative that distinguishes actual features from digitally staged elements."
      - "Generate a staging brief with a balanced palette, furniture placement, lighting plan, and lifestyle styling cues."
      - "Create several listing-description variants for different audiences while preserving factual accuracy."

  - name: "campaign_and_advertising_copy"
    description: "Marketing and commercial copywriting including launch announcements, product descriptions, sales enablement, advertising scripts, and campaign messaging."
    priority: 10
    utterances:
      - "Write a launch announcement with a clear value proposition, supporting proof points, quote placeholders, and availability details."
      - "Draft concise descriptions for multiple offerings using consistent structure, benefits, specifications, and calls to action."
      - "Create a sales FAQ addressing common objections, key features, setup questions, and next steps."
      - "Write a short broadcast advertisement with emotional storytelling, clear pacing, and minimal jargon."
      - "Draft legal footnotes and disclaimers for performance claims, pricing, limitations, and promotional conditions."
      - "Generate sales talking points organized by feature, customer benefit, proof point, and objection response."
      - "Write persuasive end-card text and calls to action for a short campaign video."
      - "Create search-ad headlines and descriptions within strict character limits."
      - "Draft landing-page copy with an above-the-fold hook, benefits, proof points, and conversion-focused calls to action."

  - name: "email_marketing_and_retention"
    description: "Lifecycle marketing, CRM workflows, email nurture sequences, customer onboarding, re-engagement, and retention messaging."
    priority: 9
    utterances:
      - "Write a personalized win-back email for inactive prospects with a relevant incentive and clear next step."
      - "Create a multi-part re-engagement sequence for high-intent contacts who have not converted."
      - "Write a welcome and onboarding sequence designed to increase early engagement and feature adoption."
      - "Generate subject-line variants using curiosity, urgency, benefit, and personalization angles."
      - "Draft a milestone email that acknowledges user progress and encourages the next meaningful action."
      - "Write a retention email for users showing early signs of disengagement or cancellation intent."
      - "Create an abandoned-action recovery sequence with dynamic fields and social proof."
      - "Draft a feedback-request email with a clear survey invitation and optional incentive."
      - "Design an automated nurture sequence driven by behavioral triggers and conversion milestones."

  - name: "social_media_and_brand_storytelling"
    description: "Organic social campaigns, platform-native formats, short-form video scripts, creator briefs, and brand narrative storytelling."
    priority: 9
    utterances:
      - "Produce an integrated social content calendar with platform-specific formats, themes, and publishing cadence."
      - "Write thought-leadership posts for an executive voice discussing change, learning, and organizational vision."
      - "Create a month-long organic content plan organized around several recurring content pillars."
      - "Draft a short-form vertical video script with a strong opening hook, visual beats, caption, and call to action."
      - "Write a series of concise thread hooks that explain useful lessons from a growth or transformation story."
      - "Create a creator collaboration brief with objectives, deliverables, usage rights, and brand guidelines."
      - "Draft an interactive poll or quiz sequence that teaches an audience about a new concept or offering."
      - "Write captions and hashtag guidance for a multi-slide social post."
      - "Develop a brand story explaining origin, purpose, values, and audience impact."
      - "Create a community response guide with tone examples for positive, neutral, and difficult comments."
      - "Draft a user-generated-content brief for an unboxing, demonstration, or first-impression video."

  - name: "seo_and_content_strategy"
    description: "Search optimization, keyword clustering, long-form content, topical authority planning, search intent analysis, and content gap evaluation."
    priority: 9
    utterances:
      - "Optimize a long-form article for primary and secondary keywords, search intent, structure, and readability."
      - "Cluster target keywords into topical groups by informational, commercial, and transactional intent."
      - "Draft an authoritative long-form guide structured for discoverability, featured snippets, and useful navigation."
      - "Conduct a content gap analysis against high-performing competing pages and identify missing topics."
      - "Write an FAQ section targeting long-tail, conversational, voice, and mobile search queries."
      - "Develop a multi-month content roadmap to build topical authority around a subject area."
      - "Write optimized metadata for several pages within strict length and intent constraints."
      - "Structure content architecture for traditional search and generative search experiences."
      - "Draft an objective comparison article with pros, cons, evaluation criteria, and search-friendly headings."
      - "Identify missing semantic subtopics and related terms needed to improve topical coverage."
      - "Generate standardized, keyword-aware title conventions for a large content inventory."

  - name: "technical_and_evidence_content"
    description: "Evidence-based content including benchmark reports, research abstracts, executive narratives, ROI cases, implementation guidance, and disclosure content."
    priority: 10
    utterances:
      - "Write an evidence and validation section covering benchmark results, measurable outcomes, assumptions, and limitations."
      - "Draft a structured research abstract with methodology, results, interpretation, and quantitative findings."
      - "Create a high-stakes presentation narrative for senior decision-makers using precise, defensible language."
      - "Write a customer-facing technical FAQ covering architecture, security, integration, and troubleshooting."
      - "Draft an abstract for a formal study with key findings, statistical context, and research implications."
      - "Generate an executive speech about strategic findings, future direction, and implementation priorities."
      - "Create an implementation guide with best practices, risks, mitigations, and practical recommendations."
      - "Write a technical evaluation brief covering specifications, service levels, limits, and certifications."
      - "Draft a non-promotional thought-leadership article about emerging risks and mitigation strategies."
      - "Produce an operational quick-reference guide with procedures, diagnostic information, and escalation paths."
      - "Write a measurable transformation case study with baseline, intervention, outcomes, and evidence."
      - "Draft an executive summary of a multi-period impact report covering savings, assumptions, and payback."

  - name: "market_intelligence_and_research"
    description: "Strategic market research, competitor analysis, audience profiles, trend forecasting, Voice of Customer analysis, and positioning matrices."
    priority: 9
    utterances:
      - "Analyze competitor pricing, messaging, positioning, audiences, strengths, and weaknesses."
      - "Build an Ideal Customer Profile with needs, behaviors, constraints, decision criteria, and buying triggers."
      - "Synthesize customer reviews into motivations, complaints, unmet needs, and churn signals."
      - "Draft a competitive positioning map and messaging matrix against relevant alternatives."
      - "Synthesize emerging audience trends and explain their potential strategic implications."
      - "Conduct a win-loss analysis identifying why people choose one option over another."
      - "Create a journey-friction analysis identifying drop-off points, causes, and improvement opportunities."
      - "Analyze market size, addressable audience, competitive dynamics, and entry considerations."
      - "Summarize sentiment and recurring themes from public or internal feedback."
      - "Develop a market-entry SWOT analysis with opportunities, risks, and recommended actions."
      - "Extract Voice of Customer quotes and organize them into product improvements and messaging themes."
      - "Evaluate competitor positioning to identify whitespace and differentiation opportunities."

  - name: "legal_regulatory_and_compliance"
    description: "Formal agreements, statutory disclosures, terms and conditions, procurement documents, policy communications, and regulatory compliance."
    priority: 10
    utterances:
      - "Review contractual provisions and create a comparative risk table highlighting non-standard terms."
      - "Translate a formal policy document into an accessible plain-language summary."
      - "Extract mandatory obligations, evaluation criteria, deadlines, and evidence requirements from a solicitation."
      - "Draft formal correspondence explaining a decision, applicable rights, and appeal procedures."
      - "Summarize indemnity, liability limits, and termination triggers in a structured risk overview."
      - "Audit promotional claims for substantiation, fair comparison, intellectual property, and disclosure concerns."
      - "Draft terms of service, privacy disclosures, and data-protection clauses for a digital service."
      - "Analyze regulatory mandates and outline governance controls needed for compliance."
      - "Create an executive briefing on licensing, intellectual property, and open-source usage risks."
      - "Review a third-party agreement for confidentiality, warranties, representations, and indemnification."
      - "Draft formal notices about mandatory policy changes and required user actions."
      - "Create an audit checklist for adherence to published standards and governance controls."

  - name: "conversational_ai_and_customer_operations"
    description: "Interactive conversational flows, automated assistants, multi-channel operational notifications, and incident status messaging."
    priority: 9
    utterances:
      - "Design a multi-turn dialog tree with intents, state transitions, fallback handling, and escalation thresholds."
      - "Compose concise operational notification templates across several delivery channels."
      - "Draft support reference articles covering eligibility, troubleshooting, resolution, and escalation."
      - "Create response playbooks and priority alerts for operational status changes."
      - "Write urgent multi-channel communications for unexpected delays or service interruptions."
      - "Configure live-chat triage prompts with latency constraints and escalation keyword detection."
      - "Draft a voice-assistant script with reminders, rescheduling prompts, and support escalation."
      - "Write empathetic canned responses for high-severity customer inquiries."
      - "Develop a diagnostic decision tree for recurring user complaints."
      - "Draft contextual messages for scheduled maintenance and service restoration."
      - "Create fallback dialog guidelines for ambiguous and edge-case queries."
      - "Write concise transactional alerts for time-sensitive account or status events."
      - "Formulate ticket-routing criteria and tiered escalation protocols."

  - name: "ai_prompt_engineering_and_systems"
    description: "Multi-step prompt chains, agentic workflows, fallback logic, telemetry triage, and structured LLM system design."
    priority: 10
    utterances:
      - "Construct a multi-step prompt chain with conditional logic, validation, retries, and fallback states."
      - "Draft a triage prompt that evaluates structured inputs and returns categories, drivers, recommendations, and confidence."
      - "Write a system prompt enforcing schema validation and structured JSON responses."
      - "Develop prompts for an automated classification engine using examples, rules, and decision trees."
      - "Author a technical architecture walkthrough and benchmark plan for a high-performance data system."
      - "Design a recommendation pipeline using historical behavior, preferences, constraints, and cold-start handling."
      - "Formulate meta-prompts for coordinating multiple agents while preserving reliable reasoning and outputs."
      - "Build an evaluation rubric that scores model responses against explicit ground-truth criteria."
      - "Write system instructions enforcing output schemas, token budgets, and key-value formatting."
      - "Design a retrieval-augmented generation prompt with citations, grounding, and source checks."
      - "Construct recursive prompts for decomposing large documents into summaries and entity relationships."
      - "Develop guardrail prompts that detect, filter, and reject unsafe or out-of-scope inputs."
      - "Create adaptive few-shot templates that select examples using semantic similarity."

  - name: "educational_and_instructional_design"
    description: "Curricula, pedagogical structures, conceptual explainer scripts, and accessible educational diagrams."
    priority: 9
    utterances:
      - "Structure a multi-week curriculum with measurable objectives, lessons, activities, and assessments."
      - "Create an intuitive educational diagram explaining a multi-stage process with accessible contrast."
      - "Draft an engaging explanation using everyday analogies for introductory learners."
      - "Design a pedagogical illustration explaining an abstract concept with clear annotations."
      - "Develop a micro-learning module with core principles, examples, practice, and self-check questions."
      - "Write an instructional guide with step-by-step walkthroughs, exercises, and answer rationales."
      - "Formulate assessment rubrics with questions, performance criteria, and grading guidance."
      - "Create an interactive syllabus with prerequisites, milestones, and learning competencies."
      - "Design an infographic showing cause-and-effect relationships and system flows."
      - "Draft a plain-language educational summary of complex technical material."
      - "Author a workshop guide with timed activities, discussion prompts, and recap exercises."
      - "Develop scaffolded modules that progressively increase in analytical complexity."
      - "Write a short educational video script with visual cue markers and a comprehension check."

  - name: "localization_and_multilingual_adaptation"
    description: "Cross-market translation, regional terminology adaptation, and culturally nuanced multilingual communications."
    priority: 9
    utterances:
      - "Localize a documentation library across multiple markets while preserving technical fidelity and tone."
      - "Adapt a scripted announcement into several languages with natural spoken cadence."
      - "Draft concise informational advisories in multiple local languages for low-literacy audiences."
      - "Translate technical support content across locales with consistent terminology and register."
      - "Compose short alerts in multiple languages for non-native or non-English-speaking audiences."
      - "Transcreate headlines and promotional messages for cultural resonance while preserving core intent."
      - "Develop a multilingual glossary of approved terminology and prohibited equivalents."
      - "Perform linguistic quality assurance to identify semantic drift, awkward syntax, and cultural issues."
      - "Translate procedural instructions into several target languages with accurate regional idioms."
      - "Localize learning materials across international cohorts while respecting linguistic conventions."
      - "Adapt customer announcements into regional dialects with culturally sensitive phrasing."
      - "Create multilingual communication guidelines for consistent voice, register, and tone."

  - name: "customer_support_knowledge_base_localization"
    description: "Localized help centers, translated knowledge-base content, support article adaptation, and multi-market customer service documentation."
    priority: 9
    utterances:
      - "Localize a large customer-support knowledge base into multiple languages while preserving accuracy and tone."
      - "Write a categorized FAQ covering access, usage, facilities, status information, and accessibility."
      - "Translate support articles across many locales while preserving terminology consistency."
      - "Create a multilingual support article for disruptions, available options, and user rights."
      - "Draft localized troubleshooting content using plain language for readers with different literacy levels."
      - "Create a support-content style guide covering tone, terminology, escalation, and translation review."

  - name: "accessibility_and_inclusive_design"
    description: "Accessible visual explanations, inclusive design assets, alt text, WCAG-conscious diagrams, and readability and contrast guidance."
    priority: 9
    utterances:
      - "Create an accessible diagram with WCAG AA contrast, a colorblind-safe palette, and no color-only encoding."
      - "Design an inclusive infographic using clear labels, accessible contrast, and a logical reading order."
      - "Write full alt text and a screen-reader-friendly summary for an educational diagram."
      - "Audit a visual for accessibility and rewrite the explanation for color-blind and low-vision audiences."
      - "Generate an accessible training visual with plain-language descriptions and sufficient contrast."
      - "Define inclusive imagery and content guidelines for a visual communication system."

  - name: "audio_and_voice_production"
    description: "Voice-over scripts, audio production briefs, meditation and sound design directions, and cinematic narrative sequencing."
    priority: 9
    utterances:
      - "Write a short trailer voice-over with progressive tension, timing cues, music direction, and on-screen text."
      - "Produce a guided meditation script with pacing, breath pauses, vocal direction, and ambient sound settings."
      - "Write a multilingual highlight voice-over with timestamped cues and natural delivery in each language."
      - "Create a narration brief with pacing, emotional arc, soundscape, and transition guidance."
      - "Draft a voice-over package with timing, emotional modulation, sound effects, and music cues."
      - "Write a synthetic-audio production brief specifying tempo, harmony, instrumentation, and stem delivery."

  - name: "multimedia_and_motion_production"
    description: "Cinematic video generation, visual motion graphics, 3D animated sequences, and dynamic visual camera motion."
    priority: 10
    utterances:
      - "Generate a short cinematic video with rotational movement, shallow focus, and controlled lighting sweeps."
      - "Develop a visual storyboard with camera movements, transitions, scene staging, and timing."
      - "Create motion-graphics direction specifying kinetic typography, geometric motion, and color transitions."
      - "Generate a multi-shot treatment detailing lenses, depth of field, lighting, and composition."
      - "Formulate an animation brief covering keyframes, secondary motion, timing, and visual style."
      - "Generate a high-definition looping motion background with particles and volumetric light."
      - "Produce a dynamic clip illustrating fluid motion, particle interaction, and dimensional lighting."
      - "Create a 3D showcase sequence with mechanical movement and changing perspective."
      - "Generate a slow-motion sequence with macro focus, reflective surfaces, and atmospheric detail."
      - "Render a stabilized aerial fly-through with gradual camera motion and changing illumination."
      - "Create stylized 2D or 3D kinetic animation with branded color transitions and smooth motion curves."
      - "Generate a time-lapse sequence showing gradual environmental or lighting transitions."

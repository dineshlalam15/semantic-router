# Generic semantic routes based on modality, task structure, complexity, and constraints.
# Utterances are domain-agnostic, task-focused, and free of industry-specific entities or prompt copies.

routes:
  # ── TEXT DOMAINS ──

  - name: "structured_catalog_generation"
    description: "Large, schema-constrained collections of detailed machine-readable content."
    priority: 10
    utterances:
      - "Generate a large batch of structured catalog records with consistent attributes, categories, and schema formatting."
      - "Create numerous uniform item listings adhering strictly to predefined fields and output validation contracts."
      - "Produce comprehensive product index entries at scale with attribute bullet points and structured machine-readable format."
      - "Write a series of standardized descriptive entries following fixed word counts, repeated subfields, and data tags."
      - "Generate high-volume structured item summaries with benefit highlights, specifications, and machine-parsable output."
      - "Build an extensive inventory dataset of descriptive entries formatted in strict JSON against an exact schema."
      - "Generate batch serialized descriptions for multiple items or episodes with hooks, summaries, and platform formatting."
      - "Produce a collection of uniform descriptive entries formatted with exact field constraints, tags, and summary points."

  - name: "agent_and_workflow_design"
    description: "Prompt chains, decision agents, conditional workflows, ranking systems, and fallback logic."
    priority: 10
    utterances:
      - "Design a multi-stage prompt chain with sequential evaluation, ranking mechanisms, and automated fallback logic."
      - "Architect an autonomous agent workflow with conditional decision gates, validation stages, and confidence thresholds."
      - "Construct an operational triage pipeline that scores input signals, classifies risk tiers, and triggers conditional actions."
      - "Develop a decision-making agent script that processes multi-source attributes and executes branching recommendation logic."
      - "Write an orchestration prompt workflow with automated fallback branches, scoring criteria, and structured status reports."
      - "Build an automated ranking and classification agent that evaluates user signals and assigns prioritized next-best actions."
      - "Create a prompt orchestration pipeline for decision routing with tiered actions, score weighting, and confidence metrics."

  - name: "executive_and_report_writing"
    description: "Premium executive commentary, impact reporting, strategic synthesis, and leadership content."
    priority: 10
    utterances:
      - "Draft measured executive commentary covering institutional performance, strategic priorities, and material risk factors."
      - "Write a leadership summary synthesizing complex organizational progress, benchmark targets, and candid performance gaps."
      - "Produce decision-ready strategic analysis using objective, defensible phrasing without ungrounded assurances."
      - "Synthesize institutional performance metrics into an authoritative, publication-ready briefing for senior stakeholders."
      - "Draft an annual governance report executive overview balancing key milestones, external headwinds, and strategic initiatives."
      - "Compose an authoritative macro-level outlook analyzing systemic risk drivers and strategic capital positioning."
      - "Prepare an institutional executive briefing analyzing operational performance, strategic positioning, and material uncertainties."

  - name: "luxury_brand_manifesto"
    description: "Premium manifestos and sensory narratives requiring exceptional, distinctive prose."
    priority: 10
    utterances:
      - "Write a poetic prestige brand manifesto exploring an evocative emotional progression with refined literary craft."
      - "Create an enigmatic, high-concept narrative for a luxury house suitable for multi-channel prestige storytelling."
      - "Develop an evocative brand narrative using sensory textures, elevated vocabulary, and a distinguished aesthetic voice."
      - "Craft an aspirational brand philosophy statement focused on craftsmanship, timeless heritage, and sensory sophistication."
      - "Produce an evocative brand manifesto that builds a poignant emotional arc while avoiding commercial clichés."
      - "Write an aspirational brand statement with poetic language, enigmatic tone, and a coherent sensory progression."

  - name: "regulated_and_policy_communications"
    description: "Regulated, compliance-sensitive messages, policy-grounded decisions, and coordinated service communications."
    priority: 10
    utterances:
      - "Draft formal policy decision letters explaining governing clauses, customer recourse rights, and dispute deadlines."
      - "Write urgent service disruption announcements across multiple communication channels with consistent, non-defensive tone."
      - "Create compliance-mandated customer alerts adhering strictly to regulatory character caps and mandatory disclosure rules."
      - "Develop a multi-channel operational crisis notification package with role-specific instructions and escalation paths."
      - "Generate a comprehensive customer support policy FAQ with explicit escalation triggers for high-risk disputes."
      - "Draft empathetic but legally binding service messages citing governing framework terms and formal appeal processes."
      - "Write coordinated operational incident updates across multiple direct channels with transparent, accountable language."

  - name: "presentation_and_landing_page_content"
    description: "Complex presentations and complete conversion pages combining narrative, data, and visual direction."
    priority: 9
    utterances:
      - "Draft a complete end-to-end conversion landing page with hero positioning, feature architecture, evidence sections, and clear calls to action."
      - "Create a structured multi-slide pitch deck combining high-level narrative titles, data exhibits, and strategic takeaways."
      - "Develop a comprehensive digital campaign page incorporating value propositions, social proof, detailed breakdown, and sign-up flows."
      - "Structure a decision-maker presentation deck that pairs analytical evidence slides with strategic recommendations and risk analysis."
      - "Produce an exhaustive long-form sales page combining narrative problem hooks, modular feature blocks, FAQs, and tiered options."
      - "Create a structured presentation with modular slide narratives, supporting charts, persona breakdowns, and risk matrices."

  - name: "premium_editorial_and_script_writing"
    description: "Long-form editorial, scripts, curricula, audio briefs, mission advocacy narratives, and thought-leadership writing."
    priority: 10
    utterances:
      - "Write an in-depth long-form editorial guide featuring structured practical advice, topical depth, and search optimization."
      - "Draft a scripted voice-over narrative with timed pacing cues, scene transitions, sound design notes, and emotional progression."
      - "Develop a comprehensive multi-module educational curriculum with clear learning objectives, exercises, and assessments."
      - "Write a persuasive narrative appeal highlighting a human interest story, verifiable impact metrics, and contribution levels."
      - "Compose an exhaustive technical or artistic production brief detailing creative parameters, stylistic references, and deliverables."
      - "Create an instructional explainer script with concise problem exposition, step-by-step demonstrations, and clear audience takeaways."
      - "Write long-form authoritative destination or industry guides with comprehensive sections and search optimization."

  - name: "multichannel_campaign_writing"
    description: "Premium lifecycle, social, launch, and multichannel content with conditional creative direction."
    priority: 9
    utterances:
      - "Design a multi-touchpoint re-engagement sequence with graduated narrative angles, tailored incentives, and clear conversion paths."
      - "Develop an omnichannel product launch campaign spanning lifecycle email cadences, social scripts, and creative briefs."
      - "Script a series of platform-native short-form promotional videos with hook openings, on-screen text, and strong calls to action."
      - "Build a personalized multi-stage user onboarding cadence with role-based conditional blocks and test variants."
      - "Create an integrated promotional narrative coordinated across direct digital messaging and public social channels."
      - "Design automated lifecycle communication sequences that adapt dynamically based on recipient status and engagement signals."

  - name: "technical_editorial_content"
    description: "Developer-first technical articles, architecture explanations, benchmark synthesis, and implementation content."
    priority: 10
    utterances:
      - "Write an in-depth technical engineering article with architectural diagrams, implementation trade-offs, and runnable code samples."
      - "Author comprehensive developer documentation explaining system internals, performance benchmarks, and deployment prerequisites."
      - "Produce an objective technical comparative analysis evaluating architecture design choices against industry standards."
      - "Draft a developer-focused launch article detailing system architecture, API mechanics, performance measurements, and migration steps."
      - "Write a technical blog post announcing a software system with problem overview, architecture, benchmarks, and code snippets."
      - "Explain complex software algorithms or distributed infrastructure systems with technical rigor, schema diagrams, and code snippets."

  - name: "packaging_copy"
    description: "On-pack copy, claims, stories, disclosures, recycling guidance, and calls to action."
    priority: 10
    utterances:
      - "Write comprehensive on-pack product packaging copy including brand narrative, hierarchy of claims, and callout badges."
      - "Draft compliant front-of-pack and back-of-pack product text with standardized regulatory placeholders and disclosure copy."
      - "Develop an on-pack messaging system balancing brand identity, technical specifications, safety warnings, and disposal instructions."
      - "Create packaging label text adhering to physical layout constraints, certification claims, and interactive scan-code prompts."
      - "Write succinct product container copy detailing variant highlights, usage instructions, mandatory disclosures, and brand story."

  - name: "lightweight_microlearning"
    description: "Short, accessible learning scripts requiring clarity, speed, and modest complexity."
    priority: 8
    utterances:
      - "Write a brief ninety-second educational script explaining a foundational concept using a simple relatable analogy."
      - "Create a concise micro-learning module for general audiences with friendly narration cues and quick knowledge checks."
      - "Explain a complex fundamental principle in under two minutes with accessible language, visual prompts, and summary takeaways."
      - "Draft a lightweight peer-level educational explanation with clear terminology, relatable framing, and a concluding quiz question."
      - "Produce short, engaging educational audio or video copy focused on single-concept clarity and immediate retention."

  - name: "multilingual_content"
    description: "High-quality multilingual scripts, advisories, and large-scale corpus localization."
    priority: 10
    utterances:
      - "Localize an extensive repository of documentation across numerous global languages while preserving terminology and brand tone."
      - "Translate and culturally adapt high-priority public advisories into multiple regional languages under strict reading-level standards."
      - "Write synchronized multi-language voice-over scripts with identical emotional tone and matched timing across all translations."
      - "Adapt a large corpus of technical support materials into worldwide languages while maintaining approved glossaries and structural formatting."
      - "Perform large-scale internationalization of customer-facing guidance across multiple language families without loss of precision."

  - name: "bulk_low_cost_generation"
    description: "Very high-volume, low-cost generation of short templates, titles, alerts, and snippets."
    priority: 9
    utterances:
      - "Generate hundreds of thousands of concise search-optimized record titles under strict character caps and extreme cost constraints."
      - "Produce high-volume operational notification templates across diverse parameterized variants with minimal per-item latency and cost."
      - "Generate a massive batch of standardized short-form strings with fixed structural syntax and tight generation budget ceilings."
      - "Create thousands of templated operational alert variations using dynamic parameter injection while minimizing overall token expenditure."
      - "Execute large-scale repetitive copy generation with uniform character limits, automated placeholders, and ultra-economical throughput."

  - name: "legal_document_analysis"
    description: "Complex document analysis, policy transformation, and formal-document risk extraction."
    priority: 10
    utterances:
      - "Extract mandatory contractual obligations, liability caps, and termination rights from complex agreements into a structured risk matrix."
      - "Analyze extensive formal solicitation documents to extract compliance criteria, map vendor capabilities, and identify operational gaps."
      - "Review dense contractual clauses against prevailing legal standards and summarize deviations with suggested fallback language."
      - "Transform dense, multi-page regulatory policy documents into an accessible plain-language public guide with procedural steps."
      - "Analyze complex multi-party agreements to identify legal liabilities, indemnification exposures, and non-standard commitments."
      - "Summarize formal contractual risks, flag deviations from standard legal provisions, and produce a structured overview table."

  - name: "real_time_customer_assistant"
    description: "Low-latency live assistants handling routine intents with explicit high-risk escalation."
    priority: 10
    utterances:
      - "Power a live conversational service assistant maintaining sub-second response times for routine transactional inquiries."
      - "Handle high-frequency conversational customer intents with strict latency guarantees and automated risk escalation triggers."
      - "Deploy a real-time conversational agent capable of rapid lookup, automated confirmation, and seamless handoff to human specialists."
      - "Build a low-latency live chat service responding within milliseconds to frequent inquiries while enforcing safety thresholds."
      - "Provide instantaneous automated conversational support for account inquiries with rigorous human-escalation protocols."

  - name: "clarification_required"
    description: "Underspecified requests that must gather requirements before generation."
    priority: 10
    utterances:
      - "A request asking to make something look professional without providing deliverable formats, audience details, or asset parameters."
      - "A broad creative briefing that lacks specifications regarding target channel, technical constraints, or deliverables."
      - "An ambiguous user inquiry requesting a general refresh or upgrade without supplying source files, style guides, or concrete goals."
      - "An underspecified project prompt that requires targeted scoping questions to identify requirements before execution can begin."
      - "A vague instruction asking to generate promotional content when the underlying format, dimensions, and acceptance criteria are missing."

  - name: "final_audio_or_video_orchestration"
    description: "Rendered final audio or video requests requiring actual media output."
    priority: 10
    utterances:
      - "Render a finished production audio track featuring voice synthesis, controlled speaking pace, acoustic pauses, and ambient mixing."
      - "Generate a completed cinematic video clip featuring smooth camera motion, shallow depth of field, dynamic lighting, and render effects."
      - "Deliver a rendered time-based media file with specified acoustic parameters, audio bed mixing, and vocal delivery rather than just a script."
      - "Produce a finished high-resolution digital video sequence with simulated camera moves, depth blur, and atmospheric lighting."
      - "Synthesize a complete polished audio master with custom vocal characteristics, ambient sound layering, and decibel-calibrated levels."
      - "Render a production-ready playable video deliverable with photorealistic camera motion and light reflection effects."

  # ── IMAGE DOMAINS ──

  - name: "creative_and_photorealistic_image"
    description: "Promotional banners, social media visuals, cinematic art, macro tabletop still life imagery, and architectural perspective imagery."
    priority: 10
    utterances:
      - "Generate a high-impact commercial marketing visual with dynamic subjects, promotional typography overlays, and call-to-action space."
      - "Produce a cohesive multi-image lifestyle visual sequence with uniform lighting, environmental styling, and social media layout."
      - "Generate dramatic stylized concept key art featuring a focal character, volumetric atmospheric lighting, and cinematic composition."
      - "Create high-fidelity commercial tabletop still life photography featuring organic surface textures, selective focus, and sculpted directional lighting."
      - "Stage an interior architectural space with designer furnishings in a distinct aesthetic while preserving room geometry and perspective."
      - "Generate photorealistic outdoor scenic landscape photography featuring golden-hour illumination, reflective water elements, and high-aesthetic styling."
      - "Create an editorial photography collection with architectural backdrops, rich textile styling, muted color palettes, and cinematic film texture."

  - name: "diagram_and_infographic_image"
    description: "Chart-led infographics, UI mockups, educational diagrams, and accessible visual explanations."
    priority: 10
    utterances:
      - "Design a structured statistical infographic featuring categorized chart elements, descriptive annotations, and iconography."
      - "Generate a realistic software interface dashboard mockup featuring sidebar navigation, structured metric summary cards, and data visualizations."
      - "Create a visual step-by-step technical diagram illustrating complex system mechanisms, flow arrows, and layer annotations."
      - "Design an accessible educational diagram adhering to high visual contrast standards, colorblind-safe palettes, and non-color coding."
      - "Generate a clean informational diagram illustrating an abstract technical process with modular callout labels and numbered phases."
      - "Create a data-dense analytical user interface mockup displaying graphical metrics, summary widgets, and structured data tables."
      - "Design a clear visual explainer illustrating how a technical system or algorithm works with directional flow and annotated layers."

  - name: "print_and_typography_image"
    description: "Typography-heavy posters, editorial layouts, exact headlines, and print-ready compositions."
    priority: 10
    utterances:
      - "Design a print-ready promotional poster featuring sharp high-density headline typography, scheduled dates, and reserved code placeholders."
      - "Create a double-page editorial print publication layout combining full-bleed imagery, typographic narrative blocks, and brand insignia."
      - "Design an advertising print collateral layout combining full-page visual composition, formal typography hierarchy, and informational text."
      - "Produce a typography-centric graphic layout where multi-word headlines and detailed text elements must render with razor-sharp fidelity."
      - "Generate a print-ready event poster with multi-tiered text hierarchy, sponsor placeholders, bleed margins, and reserved scannable areas."

  - name: "product_and_brand_image"
    description: "Packaging renders, inclusive portraiture, character concept turnaround sheets, and reference-conditioned brand visuals."
    priority: 10
    utterances:
      - "Generate photorealistic commercial product packaging renders highlighting material textures, transparency windows, and studio lighting."
      - "Create commercial portrait photography showcasing diverse complexions with authentic lighting and true undertone representation."
      - "Produce a multi-angle character concept sheet set maintaining strict stylistic consistency, proportion control, and uniform art direction."
      - "Generate conditioned commercial product imagery that accurately reproduces signature hardware, surface finishes, and geometry from reference photos."
      - "Render studio product packaging variants with color-coded label accents, realistic surface reflections, and soft studio shadow drops."
      - "Generate consistent multi-variant character concept designs sharing identical art style while varying physical attributes and equipment."

  # ── MIXED DOMAIN ──

  - name: "safety_and_claims_review"
    description: "Requests involving protected third-party material, unverified claims, or potentially misleading comparisons."
    priority: 10
    utterances:
      - "Assess proposed promotional collateral that incorporates protected competitor intellectual property or unverified performance claims."
      - "Review comparative marketing materials for trade-dress infringement, trademark misuse, and substantiation requirement risks."
      - "Generate a legally compliant creative alternative for promotional assets that initially utilized protected third-party brand elements."
      - "Evaluate advertising comparison claims for regulatory compliance, required substantiation disclosures, and fair-competition standards."
      - "Create a compliant comparative advertising concept replacing protected competitor marks with generic comparative benchmarks."

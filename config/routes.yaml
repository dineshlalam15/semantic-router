# Semantic Routes and Utterances Configuration
# Defines semantic domains and representative natural language utterances for vector comparison.

routes:
  - name: "software_engineering"
    description: "Programming, algorithms, debugging, API design, DevOps, and software architecture."
    priority: 10
    utterances:
      - "How do I implement an LRU cache in Python?"
      - "Write a function to find the longest palindromic substring."
      - "Debug this Java NullPointerException stack trace."
      - "Help me design a scalable REST API using FastAPI."
      - "How do Python asyncio event loops handle non-blocking I/O?"
      - "Explain the difference between TCP and UDP with code examples."
      - "Write a SQL query to find the second highest salary in an employees table."
      - "How do I configure a multi-stage Docker build for a Go microservice?"
      - "Refactor this recursive tree traversal function to be iterative."
      - "Explain how Kubernetes deployments manage rolling updates and health probes."
      - "Write a TypeScript interface and generic repository pattern for MongoDB."
      - "How can I prevent race conditions in concurrent Go goroutines using mutexes?"
      - "Optimize this slow PostgreSQL query using indexing and execution plans."
      - "How do I write unit tests with pytest mocking external HTTP services?"
      - "Explain the difference between optimistic and pessimistic locking in databases."

  - name: "stem_mathematics"
    description: "Mathematics, calculus, linear algebra, statistics, physics, and quantitative reasoning."
    priority: 9
    utterances:
      - "Solve the quadratic equation x^2 - 5x + 6 = 0."
      - "Calculate the derivative of f(x) = x^3 * sin(x) with respect to x."
      - "Explain how to find the eigenvalues and eigenvectors of a 3x3 matrix."
      - "Compute the definite integral of e^(-x^2) from negative infinity to infinity."
      - "What is Bayes' theorem and how is it used in conditional probability?"
      - "Prove that the square root of 2 is an irrational number."
      - "How do you solve a second-order linear homogeneous differential equation?"
      - "Explain the central limit theorem and its assumptions in statistics."
      - "What is the physical meaning of Maxwell's equations in electromagnetism?"
      - "Calculate the determinant of this 4x4 matrix."
      - "Explain the difference between covariance and correlation."
      - "How does gradient descent minimize convex multivariate loss functions?"
      - "Derive the formula for compound interest compounded continuously."
      - "Explain the Heisenberg uncertainty principle in quantum mechanics."
      - "Compute the Taylor series expansion for cos(x) centered at x = 0."

  - name: "legal_document_analysis"
    description: "Legal analysis, contract review, compliance, regulations, NDA, and terms of service."
    priority: 8
    utterances:
      - "Review this non-disclosure agreement for non-compete and indemnification clauses."
      - "What are the key data privacy requirements under GDPR Article 6 for processing consent?"
      - "Analyze the limitation of liability clause in this master services agreement."
      - "Does this software license agreement allow commercial distribution under Apache 2.0?"
      - "Draft a standard intellectual property assignment clause for employee contracts."
      - "What are the legal distinctions between a breach of warranty and breach of condition?"
      - "Identify potential compliance risks in this SaaS vendor terms of service."
      - "Explain force majeure provisions and their enforceability during global disruptions."
      - "What disclosures are required under SEC regulations for material non-public information?"
      - "Evaluate this mutual indemnification provision for third-party patent claims."
      - "Summarize the termination rights and notice periods in this commercial lease."
      - "What constitutes fair use under United States copyright law for educational materials?"
      - "Check this contract for any unilateral modification rights by the vendor."
      - "Explain statutory damages versus actual damages in intellectual property litigation."
      - "Review this privacy policy for compliance with the California Consumer Privacy Act CCPA."

  - name: "content_marketing"
    description: "Copywriting, marketing strategy, SEO optimization, social campaigns, and branding."
    priority: 7
    utterances:
      - "Write an engaging LinkedIn hook for our new B2B AI developer tool launch."
      - "Generate 5 high-converting email newsletter subject lines for a product release."
      - "How do I optimize this blog post for target SEO keywords and search intent?"
      - "Create a customer persona and value proposition for a fintech budget tracker."
      - "Write a compelling headline and call-to-action for a landing page."
      - "Draft a 30-day social media content calendar for a tech startup."
      - "How can we improve the conversion rate on our pricing page checkout funnel?"
      - "Write a persuasive press release announcing our Series A funding round."
      - "Create a script for a 60-second product demo video explaining key benefits."
      - "What are the best strategies to increase organic referral traffic through content syndication?"
      - "Write a punchy tagline for an eco-friendly consumer coffee brand."
      - "Develop an omnichannel marketing campaign concept for Black Friday Cyber Monday."
      - "How should we structure a customer case study to highlight ROI and metrics?"
      - "Write copy for a re-engagement drip campaign targeting churned SaaS users."
      - "Explain the difference between top-of-funnel brand awareness and bottom-of-funnel direct response."

  - name: "general_everyday_chat"
    description: "Casual conversation, greetings, lifestyle suggestions, trivia, and everyday general queries."
    priority: 5
    utterances:
      - "Good morning! How are you doing today?"
      - "What are some quick, healthy breakfast ideas I can make in under 10 minutes?"
      - "Can you recommend some popular sci-fi books published in the last decade?"
      - "Tell me a fun and surprising trivia fact about space exploration."
      - "How can I improve my sleep schedule and nighttime routine?"
      - "What is a good beginner-friendly workout routine for home without equipment?"
      - "Explain why the sky looks blue during the day in simple terms."
      - "I feel a bit stressed today, can you share some relaxing mindfulness tips?"
      - "What are some interesting hobbies someone can pick up on weekends?"
      - "Tell me a lighthearted joke to brighten my afternoon."
      - "What are the essential items to pack for a five-day hiking trip?"
      - "How do I keep indoor house plants healthy during the winter months?"
      - "Who invented the printing press and in what century?"
      - "What is a simple recipe for homemade sourdough bread?"
      - "Hello there, just checking in to see how everything works!"

# Semantic Routes and Utterances Configuration: Core Marketing Workloads. 

routes:

  - name: "commercial_visual_production"
    description: "Photorealistic and cinematic commercial image generation including campaign hero visuals, studio product renders, digital billboards, and retail showroom displays across all industries."
    priority: 10
    utterances:
      - "Render a cinematic exterior hero shot of a flagship smart hardware device on a sleek minimalist desk at sunset with subtle ambient lighting."
      - "Generate a studio-quality 360-degree turntable sequence for a luxury consumer product in pearl white matte finish with soft key lighting."
      - "Create a dramatic night-time digital billboard visual for a major product launch — dark gradient background, neon light accents, minimal brand tagline space."
      - "Produce an in-context lifestyle shot of a modern family using an interactive smart home display in a sunlit kitchen with warm natural light."
      - "Design a high-energy photorealistic hero image of an athlete wearing premium sports apparel in a rainy urban street with vibrant city reflections."
      - "Render a clean side-profile studio shot of an industrial power tool on a pristine white cyclorama with controlled soft shadow underlay."
      - "Create a campaign-quality outdoor adventure visual showing rugged weatherproof travel gear on a rocky mountain summit at golden hour."
      - "Generate a visual comparison of three tiers of a premium device lineup showing varying material finishes and subtle feature callout highlights."
      - "Produce an authentic lifestyle scene of a young professional working with a sleek laptop at a bustling European sidewalk café."
      - "Create a photorealistic environment scene showing an automated smart kiosk operating in a futuristic transport terminal at dusk."
      - "Design a high-impact product launch visual captured from a dynamic low aerial drone perspective in an open scenic landscape."
      - "Render a macro detail close-up sequence showcasing premium brushed aluminium textures, precision dials, and seamless seams of an executive gadget."
      - "Generate an aspirational brand campaign hero image featuring a group of friends using outdoor leisure equipment against a scenic mountain backdrop."
      - "Produce a studio pack shot of a new consumer product line in four distinct seasonal colorways arranged in a 2×2 grid layout."
      - "Create a retail flagship store ambient loop visual of a premium product displayed on an illuminated rotating plinth with sleek brand backdrop."

  - name: "marketing_collateral_and_layout"
    description: "Commercial marketing design assets including studio e-commerce packaging, candid lifestyle imagery, technical process infographics, event banners, and multi-panel print and digital layouts."
    priority: 10
    utterances:
      - "Generate a photorealistic studio pack shot of an e-commerce retail package on a clean white surface with sharp shadows and brand-accurate colors."
      - "Create an authentic lifestyle image of customers enjoying an everyday activity — warm natural lighting, candid feel, diverse representation."
      - "Design a clean technical architecture and workflow diagram in an elegant modern infographic palette for an executive pitch deck."
      - "Produce a 600×2000px exhibition booth banner for an industry conference — modern dark blue gradient, bold headline space, sponsor footer."
      - "Generate a diverse group of users from varied demographics collaborating actively in a modern creative workspace, authentic and empathetic feel."
      - "Illustrate a multi-variable performance and ROI growth curve in a publication-quality infographic style with clear labeled axes and benchmark bands."
      - "Create a double-page magazine spread layout placeholder with a full-bleed lifestyle image on the left and structured data callouts on the right."
      - "Design a standard 300×600px digital display ad banner with vibrant gradient background, targeted B2B messaging, and a high-contrast CTA button."
      - "Produce a branded customer lifecycle infographic illustrating five stages from initial discovery to brand loyalty with custom icon illustrations."
      - "Generate an intricate product cutaway illustration highlighting internal engineering components and high-precision build quality."
      - "Create a pitch deck slide template background — subtle abstract geometric patterns with clean light container cards for data tables."
      - "Design a trade show pull-up banner featuring aspirational product imagery, compelling value proposition headline, and minimal logo placement."
      - "Produce a tri-fold marketing brochure visual layout: Panel 1 as hero brand cover, Panel 2 as technical workflow diagram, Panel 3 as onboarding steps."
      - "Generate a promotional reminder direct-mail card visual — friendly custom illustration, product badge icon, clean modern typography."
      - "Create a B2B trade publication quarter-page print ad visual depicting a client and consultant strategy session in a contemporary office."

  - name: "campaign_and_advertising_copy"
    description: "Marketing and commercial copywriting including product launch press releases, configurator UI copy, sales enablement FAQs, TV and video scripts, and multi-channel campaign messaging."
    priority: 10
    utterances:
      - "Write a 600-word press release for the global commercial launch of an innovative product line including technical benchmarks, executive quotes, and market availability."
      - "Draft all tier-level descriptions for a three-tier interactive product configurator — starter, professional, and enterprise — each under 80 words."
      - "Create a 30-question sales partner training FAQ addressing technical specifications, common customer objections, and onboarding setup."
      - "Generate punchy benefit-driven marketing copy for 10 optional add-on accessories in a product catalog, each description under 40 words."
      - "Write a script for a 60-second broadcast brand commercial introducing a flagship consumer product — emotional tone, authentic storytelling, zero jargon."
      - "Draft a product catalog introduction paragraph (200 words) positioning a new premium brand against established market competitors."
      - "Write clear legal footnotes and disclaimer copy for performance benchmarks, battery life claims, and promotional financing terms in a commercial brochure."
      - "Write a 400-word brand editorial for an industry trade magazine highlighting the sustainable manufacturing and ethical supply chain behind a new product."
      - "Generate sales battlecard talking points (one per feature) for a five-pillar product presentation at an upcoming partner launch event."
      - "Draft a customer-facing guide explaining complex technical capabilities, compatibility requirements, and setup steps in plain accessible language."
      - "Write persuasive end-card super-text and call-to-action copy for a 90-second digital video ad promoting an annual subscription discount."
      - "Create a comprehensive product tier comparison matrix with feature annotations and buyer guidance for three enterprise solution packages."
      - "Write 5 high-converting Google responsive search ad headlines and descriptions under 30 characters each."
      - "Craft a direct-response landing page copy structure with an irresistible above-the-fold hook and trust badges."
      - "Write an engaging radio commercial script (30 seconds) promoting a seasonal summer sale with a catchy promotional tagline."

  - name: "email_marketing_and_retention"
    description: "Lifecycle marketing, CRM workflows, email nurture sequences, customer onboarding drips, re-engagement campaigns, and churn prevention messaging."
    priority: 9
    utterances:
      - "Write a personalized win-back email for prospective buyers who abandoned their custom product configuration 60 days ago, offering a limited-time incentive."
      - "Create a 3-part CRM re-engagement email sequence targeting high-intent leads who attended a virtual demo but did not convert."
      - "Write a 4-email welcome and onboarding sequence for new SaaS trial users designed to drive feature adoption within the first 14 days."
      - "Generate 10 high-converting email subject lines with curiosity hooks and urgency angles for a Black Friday promotional launch."
      - "Draft an automated transactional milestone celebration email congratulating customers on reaching 100 days of active platform usage."
      - "Write a customer retention email offering a specialized annual renewal discount to subscribers showing early signals of account churn."
      - "Draft a re-engagement drip campaign targeting inactive newsletter subscribers with a short feedback survey and exclusive perk."
      - "Write an empathetic customer onboarding email sequence introducing customer support channels, video tutorials, and weekly office hours."
      - "Create an abandoned checkout recovery email sequence (2 parts) with dynamic product name fields and customer review social proof."
      - "Draft an exclusive VIP customer appreciation email announcing early access to an upcoming premium product release."
      - "Write a customer feedback request email post-purchase asking for a review with an incentive entry for a gift card."
      - "Draft a quarterly customer newsletter template highlighting new product features, customer case study spotlight, and upcoming webinars."

  - name: "social_media_and_brand_storytelling"
    description: "Organic social media campaigns, platform-native formats (LinkedIn, Instagram, X, TikTok), viral video scripts, influencer briefs, and brand narrative storytelling."
    priority: 9
    utterances:
      - "Produce an integrated social media launch calendar (10 posts) for a major campaign covering LinkedIn, Instagram, and X formats."
      - "Write 5 engaging LinkedIn thought-leadership posts for an executive team discussing industry transformation and company vision."
      - "Create a 30-day organic social content plan for an eco-friendly consumer brand organized around 3 core content pillars."
      - "Draft a script for a 30-second TikTok and Instagram Reel showing a behind-the-scenes product packaging process with trending audio cues."
      - "Write 7 punchy viral Twitter X thread hooks that break down lessons from scaling a bootstrap startup to 10M ARR."
      - "Create an influencer collaboration briefing document detailing campaign objectives, required content deliverables, and brand do's and don'ts."
      - "Draft an interactive Instagram Story poll and quiz sequence to educate followers about a new sustainable ingredient lineup."
      - "Write captions and hashtag strategy for 5 Instagram carousel slides breaking down common industry misconceptions."
      - "Develop a brand storytelling narrative explaining our founding story and core company values for an 'About Us' social video."
      - "Create a community engagement response guide with tone-of-voice examples for responding to viral customer comments on social channels."
      - "Write an announcement post for LinkedIn celebrating our recognition in the annual Fast Company World Changing Ideas list."
      - "Draft a creative brief for user-generated content (UGC) creators for an unboxing and first-impressions product video."

  - name: "seo_and_content_strategy"
    description: "Search engine optimization, keyword clustering, long-form educational blog articles, topical authority planning, search intent analysis, and content gap evaluation."
    priority: 9
    utterances:
      - "How do I optimize a long-form blog post for primary and secondary SEO target keywords and user search intent?"
      - "Cluster these 50 target keywords into topical pillars by informational, commercial, and transactional search intent."
      - "Draft an in-depth 2000-word definitive guide on enterprise cybersecurity best practices structured for featured snippet optimization."
      - "Conduct a content gap analysis comparing our product landing page against the top 3 ranking Google search competitors."
      - "Write a comprehensive FAQ section for an e-commerce category page targeting long-tail voice and mobile search queries."
      - "Develop a 6-month content roadmap to establish domain topical authority in cloud infrastructure automation."
      - "Write an SEO-optimized meta title and meta description tag package for 10 core service pages under 155 characters each."
      - "How do we structure our website content architecture to optimize for Google AI Overviews and Generative Engine Optimization GEO?"
      - "Draft a comparison review article analyzing 'Option A vs Option B' with an objective breakdown, pros and cons, and buying criteria."
      - "Identify missing semantic subtopics and LSI keywords needed to rank on page 1 for the query 'best CRM software for small business'."
      - "Write an executive summary and key takeaways block for an in-depth research report to capture search engine zero-click intent."
      - "Create a step-by-step tutorial blog article explaining how to set up automated workflow triggers with clear subheadings."

  - name: "technical_and_evidence_content"
    description: "High-stakes, evidence-based marketing content including benchmark whitepapers, research abstracts, executive keynote speeches, ROI business cases, and compliance disclaimers."
    priority: 10
    utterances:
      - "Write the evidence and validation section for an enterprise solution detail aid covering independent benchmark results, ROI metrics, and security disclosures."
      - "Draft a 250-word structured conference abstract summarizing a multi-year customer outcome study in standard IMRD format with key quantitative metrics."
      - "Write a high-stakes B2B sales presentation narrative (6 slides, 80 words per slide) presenting an enterprise solution to C-level decision-makers."
      - "Create a comprehensive customer-facing knowledge base FAQ covering technical architecture, security protocols, integration methods, and troubleshooting."
      - "Write a formal industry symposium abstract highlighting key findings from a large-scale reliability study with statistical significance details."
      - "Draft an executive keynote speech transcript for a corporate VP presenting strategic market research and technology roadmaps — 15 minutes, engaging tone."
      - "Generate a comprehensive customer success and implementation guide — clear language, best practice recommendations, risk mitigation tips."
      - "Write a technical product evaluation brief for enterprise procurement teams detailing specifications, uptime SLAs, API rate limits, and compliance certifications."
      - "Draft a non-promotional educational thought-leadership article for an industry publication on emerging technology risks and proactive mitigation strategies."
      - "Create an operational cheat-sheet and quick-reference card outlining critical operating procedures, diagnostic codes, and support escalation tiers."
      - "Write a 400-word customer transformation case study for a corporate website illustrating the measurable impact of implementing a new platform."
      - "Produce the executive summary of an independent economic impact (TEI) report for financial decision-makers analyzing multi-year cost savings and payback period."
      - "Draft an automated voice assistant IVR script for client appointment reminders — friendly, concise, with rescheduling prompts and support escalation."

  - name: "market_intelligence_and_research"
    description: "Strategic market research, competitor teardowns, ideal customer profile (ICP) personas, consumer trend forecasting, Voice of Customer analysis, and positioning matrices."
    priority: 9
    utterances:
      - "Analyze competitor pricing tiers, messaging claims, and target audiences across the top 4 players in the project management software space."
      - "Build a detailed Ideal Customer Profile ICP buyer persona for a Chief Information Security Officer at a mid-market financial institution."
      - "Synthesize 100 customer G2 and Trustpilot reviews into top 5 buyer motivations, key feature complaints, and common churn triggers."
      - "Draft a competitive positioning perceptual map and messaging matrix comparing our brand value proposition against market incumbents."
      - "Synthesize emerging consumer trends in sustainable packaging and circular economy adoption across consumer packaged goods."
      - "Conduct a win-loss analysis summary report identifying the top 3 reasons prospects choose our solution over alternative vendors."
      - "Create a customer journey friction analysis identifying key drop-off stages in a B2B enterprise procurement cycle."
      - "Analyze the market size, addressable audience, and competitive dynamics for entering the European healthcare technology sector."
      - "Summarize customer sentiment and social listening discussions around our brand's recent pricing restructuring announcement."
      - "Develop a market entry SWOT analysis evaluating opportunities and risks for launching an AI-powered sales enablement platform."
      - "Extract key Voice of Customer VoC verbatim quotes and organize them into product roadmap feature requests and marketing hooks."
      - "Evaluate competitor brand positioning statements to identify whitespace opportunities for our upcoming brand repositioning."

# Semantic Routes and Utterances Configuration
# Distribution (80/20 rule):
# Industry routes (automotive + pharma): ~80%  
# General routes                       : ~20%  
# Each domain maps to one optimal model as declared in models.yaml.

routes:

  - name: "automotive_visual_production"
    description: "Photorealistic and cinematic automotive image generation including campaign visuals, studio renders, digital billboards, and showroom displays for car brands."
    priority: 10
    utterances:
      - "Render a cinematic exterior shot of a next-gen electric sedan on a coastal highway at sunset with motion blur on the rear wheels."
      - "Generate a studio-quality 360-degree turntable sequence for a luxury crossover in pearl white finish with soft key lighting."
      - "Create a dramatic night-time billboard visual for a hybrid SUV launch — dark gradient background, headlight light trails, minimal brand space."
      - "Produce an in-cabin lifestyle shot of a young family inside a premium SUV with panoramic sunroof and warm afternoon light."
      - "Design a photorealistic hero image of a sports coupe drifting on a wet urban road with neon city reflections."
      - "Render a side-profile studio shot of a pickup truck on a clean white cyclorama with controlled shadow underlay."
      - "Create a campaign-quality off-road visual showing a rugged 4x4 climbing rocky terrain at golden hour."
      - "Generate a comparison visual of three trim levels of the same EV sedan — exterior colors varying, spec highlight overlays."
      - "Produce an outdoor lifestyle shot of a compact city car parked at a European café with ambient street atmosphere."
      - "Create a photorealistic charging station scene showing an EV plugged in at a futuristic urban charging hub at dusk."
      - "Design a launch visual for a convertible sports car with the top down, shot from a low drone angle on open highway."
      - "Render a detail close-up sequence of the front grille, alloy wheels, and door handle of a luxury executive saloon."
      - "Generate a brand campaign image showing a family SUV parked at a mountain viewpoint — aspirational and wide format."
      - "Produce a studio pack shot of a new EV in four colorway options arranged in a 2×2 grid format for brochure use."
      - "Create a dealer showroom ambient loop visual of a flagship sedan on a rotating plinth with soft spotlight and brand backdrop."


  - name: "automotive_content_writing"
    description: "Automotive marketing and technical copywriting including press releases, configurator UI copy, dealer training materials, customer emails, and campaign scripts."
    priority: 10
    utterances:
      - "Write a 600-word press release for the global market launch of a plug-in hybrid crossover including WLTP range figures and CEO quote."
      - "Draft all trim-level descriptions for a three-tier EV configurator — entry, mid, and signature — each under 80 words."
      - "Create a 30-question dealer training FAQ covering hybrid powertrain technology, range anxiety objections, and home-charging setup."
      - "Write a personalised email for lapsed SUV enquirers who browsed the configurator 60 days ago, incentivising with 0% finance for 24 months."
      - "Generate feature marketing copy for 10 optional accessories on a flagship sedan, each description under 40 words."
      - "Write a script for a 60-second brand TV commercial introducing an all-electric family SUV — emotional tone, no voiceover jargon."
      - "Draft a product brochure introduction paragraph (200 words) positioning a new compact EV against premium European rivals."
      - "Produce a social media launch calendar (10 posts) for a new hybrid model covering LinkedIn, Instagram, and X formats."
      - "Write the legal footnotes and disclaimer copy for range claims, fuel economy figures, and finance offers in an EV brochure."
      - "Create a CRM re-engagement email sequence (3 parts) targeting test-drive no-shows for a flagship electric saloon launch."
      - "Write a 400-word editorial piece for a car magazine on the sustainability story behind the new battery supply chain."
      - "Generate dealer talking-point cards (one per feature) for a five-feature EV technology presentation at a launch event."
      - "Draft a customer-facing explanation of real-world charging speeds, home wallbox options, and public network compatibility."
      - "Write end-card and super-text copy for a 90-second online video ad promoting a zero-deposit SUV subscription offer."
      - "Create a comprehensive model specification comparison table with copy annotations for three variants of a luxury estate."


  - name: "pharma_visual_design"
    description: "Regulated pharmaceutical image generation including drug product photography, patient lifestyle imagery, scientific pathway illustrations, and HCP congress banner design."
    priority: 10
    utterances:
      - "Generate a photorealistic studio pack shot of a prescription tablet blister pack on a clean white surface, brand-compliant colours."
      - "Create a patient lifestyle image showing an elderly couple enjoying a morning walk in a park — warm natural light, no medical devices visible."
      - "Design a scientific cross-section illustration of a cell receptor interaction mechanism in a clean infographic palette for an HCP slide deck."
      - "Produce a congress booth banner (600×2000px) for an oncology drug — dark blue gradient, headline space, ISI block area at the bottom."
      - "Generate a diverse group of patients of different ages and ethnicities in an active post-treatment lifestyle setting, empathetic feel."
      - "Illustrate a pharmacokinetic absorption curve in a clean, publication-quality scientific style with labelled axes and confidence band shading."
      - "Create a double-page spread layout placeholder with a hero lifestyle image on the left and structured data callout space on the right."
      - "Design a 300×600px ESMO digital banner for a JAK inhibitor brand — coral gradient background, HCP audience, ISI text block at the base."
      - "Produce a branded patient journey infographic showing five stages from diagnosis to stable maintenance therapy with icon-based illustrations."
      - "Generate a high-resolution anatomy illustration highlighting joint inflammation sites relevant to a rheumatoid arthritis treatment mechanism."
      - "Create an eDetail slide background — abstract cellular blue-toned imagery with a clear white overlay area for clinical data tables."
      - "Design a medical conference pull-up banner for a diabetes drug featuring aspirational patient imagery and minimal brand mark placement."
      - "Produce a tri-fold brochure visual with Panel 1 as a brand hero, Panel 2 as a mechanism-of-action anatomical illustration, Panel 3 as instructional icons."
      - "Generate a patient reminder card visual — friendly nurse illustration, pill pack icon, simple bold typography, warm approachable palette."
      - "Create a trade publication quarter-page ad visual for a cholesterol-lowering biologic with patient and physician interaction scene."


  - name: "pharma_medical_writing"
    description: "Regulated pharmaceutical content writing including clinical evidence summaries, congress abstracts, MLR-ready promotional copy, patient education, and HCP communications."
    priority: 10
    utterances:
      - "Write the clinical evidence section for an HCP detail aid covering Phase III trial endpoints, NNT, adverse event profile, and black box warning language."
      - "Draft a 250-word structured abstract for an EULAR congress submission on a Phase II biologics study — IMRD format with p-values and confidence intervals."
      - "Write a 3-email patient nurture sequence for newly diagnosed Type 2 diabetes patients starting a new GLP-1 therapy — empathetic, FDA-compliant, adherence-focused."
      - "Generate five LinkedIn posts for a medical affairs team sharing Phase III data — each 150 words, fair-balance compliant, professional scientific tone."
      - "Draft an IVR script for an automated patient medication reminder — friendly, concise, includes dosing prompt and escalation to nurse helpline."
      - "Write an oncologist-targeted eDetail slide deck narrative (6 slides, 80 words per slide) for a second-line colorectal cancer therapy."
      - "Create a patient-facing frequently asked questions document covering drug mechanism, side effects, injection technique, and storage for a self-injectable biologic."
      - "Write an abstract for an ASH congress submission on a CAR-T cell therapy study including primary endpoint, safety data, and clinical implications."
      - "Draft an MLR-ready speaker bureau talk transcript for a rheumatologist presenting registry data on a PDE4 inhibitor — 15 minutes, balanced tone."
      - "Generate a patient adherence guide for a once-weekly oral medication — plain language, lifestyle tips, managing missed doses, when to call the doctor."
      - "Write a clinical pharmacology summary sheet for a hospital formulary submission covering mechanism, PK/PD, drug interactions, and renal dosing adjustments."
      - "Draft a disease awareness editorial for a pharma brand medical affairs blog on early recognition of pulmonary arterial hypertension — non-promotional."
      - "Create a prescriber reminder card with dosing chart, contraindications, and monitoring schedule for a newly approved immunosuppressant."
      - "Write a 400-word patient story for a branded patient support programme website capturing the treatment journey for a plaque psoriasis medication."
      - "Produce the executive summary of a health economic outcomes research (HEOR) report for a payer audience on a biosimilar cost-effectiveness analysis."


  - name: "software_engineering"
    description: "Programming, algorithms, debugging, API design, DevOps, and software architecture."
    priority: 7
    utterances:
      - "How do I implement an LRU cache in Python using OrderedDict?"
      - "Debug this Java NullPointerException and explain the root cause from the stack trace."
      - "Help me design a scalable REST API in FastAPI with authentication and rate limiting."
      - "Write a SQL query to find the second highest salary from an employees table."

  - name: "stem_mathematics"
    description: "Mathematics, calculus, linear algebra, statistics, physics, and quantitative reasoning."
    priority: 7
    utterances:
      - "Solve the quadratic equation and explain the discriminant condition for real roots."
      - "Explain how to find eigenvalues and eigenvectors for a 3×3 matrix step by step."
      - "What is Bayes' theorem and how is it applied in conditional probability problems?"
      - "How does gradient descent minimise a convex loss function in machine learning?"

  - name: "legal_document_analysis"
    description: "Legal analysis, contract review, compliance, regulations, NDA, and terms of service."
    priority: 7
    utterances:
      - "Review a non-disclosure agreement for risky non-compete and indemnification clauses."
      - "What are the key data privacy obligations under GDPR Article 6 for processing consent?"
      - "Identify potential compliance issues in a SaaS vendor's terms of service document."
      - "Draft a standard intellectual property assignment clause for employee contracts."

  - name: "content_marketing"
    description: "Copywriting, marketing strategy, SEO optimisation, social campaigns, and branding."
    priority: 6
    utterances:
      - "Write a high-converting LinkedIn hook for a B2B SaaS developer tool launch announcement."
      - "Generate five email newsletter subject lines for a new product release targeting SMBs."
      - "How do I optimise a blog post for target SEO keywords and user search intent?"
      - "Write copy for a re-engagement drip campaign targeting churned B2B SaaS subscribers."

  - name: "general_everyday_chat"
    description: "Casual conversation, greetings, lifestyle suggestions, trivia, and everyday general queries."
    priority: 5
    utterances:
      - "Good morning! Can you help me plan a productive daily routine for remote work?"
      - "What are some quick healthy breakfast ideas I can prepare in under 10 minutes?"
      - "How can I improve my sleep quality and build a better nighttime wind-down routine?"
      - "Tell me an interesting fact about space exploration I probably haven't heard before."

  - name: "image_generation"
    description: "General-purpose text-to-image prompts, artistic style synthesis, logo design, and creative visual rendering."
    priority: 6
    utterances:
      - "Generate a photorealistic portrait of an astronaut exploring a bioluminescent alien landscape."
      - "Create a digital watercolour illustration of a serene Japanese zen garden at dawn."
      - "Design a modern minimalist vector logo for an artisan coffee roastery brand."
      - "Create an architectural concept rendering of a sustainable glass tower with vertical gardens."

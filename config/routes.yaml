# Generic semantic routes based on modality, task structure, complexity, and constraints.

routes:
  - name: "advertising_creative_image"
    description: "Polished promotional imagery with commercial composition and reserved copy space."
    priority: 10
    utterances:
      - "Create a high-impact promotional hero image with people, visual energy, and reserved areas for headline and action text."
      - "Design polished advertising artwork with a strong focal subject, controlled composition, and campaign-ready styling."
      - "Generate a cohesive set of lifestyle promotional visuals with consistent art direction and space for supporting copy."
      - "Produce a wide commercial image with dynamic styling, diverse representation, and a clear visual hierarchy."

  - name: "structured_catalog_generation"
    description: "Large, schema-constrained collections of detailed machine-readable content."
    priority: 10
    utterances:
      - "Generate dozens of detailed entries with consistent fields, attributes, tags, and valid JSON."
      - "Create a structured collection whose records follow an exact schema and formatting contract."
      - "Produce search-aware descriptions at scale while preserving field completeness and machine-readable output."
      - "Build a taxonomy or question-and-answer dataset with predictable keys, nested sections, and reliable structure."
      - "Write many fixed-length descriptive records with an opening statement, bullet attributes, category tags, and JSON output."
      - "Generate a medium-sized batch of rich text entries with exact word counts, repeated subfields, and schema validation."

  - name: "agent_and_workflow_design"
    description: "Prompt chains, decision agents, conditional workflows, ranking systems, and fallback logic."
    priority: 10
    utterances:
      - "Design a prompt chain that ranks options from several input signals and explains each result."
      - "Build an agent workflow with decision stages, confidence scoring, and fallback behavior for missing history."
      - "Create conditional templates driven by user attributes, activity signals, and experiment variants."
      - "Develop a triage process that assigns a risk tier, identifies key drivers, recommends an action, and reports uncertainty."
      - "Write orchestration logic with validation, ranked outputs, next-best actions, and machine-readable results."

  - name: "executive_and_report_writing"
    description: "Premium executive commentary, impact reporting, strategic synthesis, and leadership content."
    priority: 10
    utterances:
      - "Draft measured executive commentary covering current conditions, strategic positioning, material risks, and balanced conclusions."
      - "Write an executive summary of an annual report with targets, progress, evidence, and candid setbacks."
      - "Produce decision-ready strategic synthesis using precise, defensible language and no unsupported guarantees."
      - "Summarize complex performance evidence into a credible leadership narrative without promotional overstatement."

  - name: "data_infographic_image"
    description: "Chart-led infographics and annotated visual explanations of quantitative information."
    priority: 10
    utterances:
      - "Design a data infographic with a labeled chart, clear annotations, category icons, and a controlled color palette."
      - "Create an information graphic that turns comparative statistics into an accessible visual hierarchy."
      - "Produce a chart-led visual with readable labels, concise callouts, accurate axes, and a clean background."
      - "Generate a visual explanation combining quantitative data, icons, legends, and clearly rendered text."

  - name: "regulated_customer_communications"
    description: "Regulated, empathetic, compliance-sensitive messages across short and long channels."
    priority: 10
    utterances:
      - "Write regulated alerts with strict length limits, varied urgency, and clear recipient actions."
      - "Create a comprehensive support FAQ with escalation triggers for high-risk situations."
      - "Draft an empathetic decision message in plain language that cites governing terms and explains available rights."
      - "Produce concise communications suitable for compliance review and recipients with different support needs."

  - name: "high_stakes_policy_writing"
    description: "Policy-grounded decisions and coordinated service communications requiring accuracy and judgment."
    priority: 10
    utterances:
      - "Draft a plain-language adverse-decision letter that cites the governing clause, explains review rights, and gives a deadline."
      - "Write an empathetic high-stakes explanation with exact procedural rights and no specialist jargon."
      - "Create coordinated disruption communications across a spoken announcement, short alert, detailed message, and follow-up text."
      - "Produce accountable multi-channel messaging that balances procedural accuracy, empathy, and channel-specific limits."
      - "Write a complete multi-channel response to a prolonged operational disruption using voice, push, email, and text formats."
      - "Coordinate four channel-specific updates for a time-sensitive service interruption with accountable language."

  - name: "presentation_and_landing_page_content"
    description: "Complex presentations and complete conversion pages combining narrative, data, and visual direction."
    priority: 9
    utterances:
      - "Develop a multi-slide presentation with narrative, data visualizations, risk analysis, and a case study."
      - "Create a complete conversion page with hero content, benefits, detailed sections, profiles, pricing, and questions."
      - "Structure a decision-maker deck that combines conceptual illustrations with evidence-led slide narratives."
      - "Write and organize a full campaign page with visual briefs, persuasive sections, proof, and calls to action."

  - name: "premium_script_and_course_writing"
    description: "High-quality scripts, curricula, educational programs, and polished instructional content."
    priority: 9
    utterances:
      - "Write a cinematic voice-over script with timed emotional progression, audio cues, and on-screen text."
      - "Create an explainer script with scene direction, narration, annotations, and a clear call to action."
      - "Design a multi-week course with objectives, modules, activities, assessments, and accessible instruction."
      - "Develop polished learning content for non-specialists with scaffolded concepts and practical exercises."

  - name: "game_and_editorial_art"
    description: "Cinematic key art, stylized editorials, character-focused imagery, and cohesive visual series."
    priority: 10
    utterances:
      - "Generate dramatic narrative key art with a central character, cinematic lighting, and painterly atmosphere."
      - "Create a premium editorial image series with controlled setting, art direction, texture, and palette."
      - "Produce display-ready artwork with a heroic focal subject and a consistent visual world."
      - "Design publication-quality images with cohesive styling and a defined accent-color system."
      - "Generate a multi-image editorial photography series with models, architectural settings, natural light, grain, and controlled color."
      - "Create several publication-ready photographs that share one art direction while varying a single visual accent."

  - name: "premium_editorial_writing"
    description: "Long-form editorial, search-aware, fundraising, narrative, and thought-leadership writing."
    priority: 10
    utterances:
      - "Write responsible episode descriptions with narrative hooks, accurate summaries, discoverability terms, and ethical tone."
      - "Create a long-form expert guide with useful structure, practical advice, and search optimization."
      - "Draft an emotive appeal with a dignified human story, impact arithmetic, contribution tiers, and a gentle deadline."
      - "Produce long-form thought leadership with strong editorial judgment, topical authority, and polished prose."

  - name: "luxury_brand_manifesto"
    description: "Premium manifestos and sensory narratives requiring exceptional, distinctive prose."
    priority: 10
    utterances:
      - "Write a poetic prestige manifesto built around a progression of sensory notes without familiar clichés."
      - "Create an enigmatic high-end narrative suitable for press, web, physical spaces, and spoken delivery."
      - "Develop a refined sensory story with aspirational language, original imagery, and a coherent emotional arc."
      - "Produce exceptional editorial prose for a premium offering across several touchpoints."

  - name: "audio_production_brief"
    description: "Textual briefs for music, voice, and sound production rather than rendered media."
    priority: 9
    utterances:
      - "Write a detailed music-generation brief specifying tempo, key, instrumentation, emotional arc, and stem delivery."
      - "Create an audio production plan covering pacing, performance direction, sound bed, mix levels, and file outputs."
      - "Develop a composition brief with musical structure, transitions, instrumentation, and technical delivery requirements."
      - "Prepare voice and sound-design instructions for a production tool without claiming to render final audio."

  - name: "hospitality_and_food_photography"
    description: "Photorealistic scene and subject photography with accurate materials, lighting, and styling."
    priority: 10
    utterances:
      - "Generate a photorealistic aspirational scene with serene natural light, reflective surfaces, architecture, and no people."
      - "Create appetizing overhead photography with accurate texture, styled accompaniments, and moody side lighting."
      - "Produce premium lifestyle imagery with polished staging, realistic materials, and editorial composition."
      - "Render a tactile subject photograph with convincing detail, controlled highlights, and a carefully styled surface."

  - name: "multichannel_campaign_writing"
    description: "Premium lifecycle, social, launch, and multichannel content with conditional creative direction."
    priority: 9
    utterances:
      - "Design a multi-message re-engagement sequence with emotional progression, offer strategy, copy, and image direction."
      - "Plan several platform-native short videos with hooks, visual treatments, captions, tags, and calls to action."
      - "Build a personalized onboarding sequence with conditional blocks and subject-line experiments."
      - "Create an integrated launch plan spanning lifecycle messages, short-form scripts, and creative briefs."

  - name: "technical_editorial_content"
    description: "Developer-first technical articles, architecture explanations, benchmark synthesis, and implementation content."
    priority: 10
    utterances:
      - "Write a detailed technical article covering the problem, architecture, measured benchmarks, code, and migration guidance."
      - "Produce technical documentation that explains a system design with evidence and runnable examples."
      - "Create a technical comparison using defensible measurements, limitations, and implementation details."
      - "Draft a deep engineering narrative with code snippets and no superficial promotional language."

  - name: "ui_mockup_image"
    description: "High-fidelity interface mockups, dashboards, application screens, and software visuals."
    priority: 10
    utterances:
      - "Generate a realistic dark interface with navigation, summary cards, charts, and a structured data table."
      - "Create a polished application screenshot mockup suitable for a digital hero area."
      - "Design a high-fidelity interface with precise component hierarchy and legible labels."
      - "Produce a professional desktop UI visual with consistent spacing, controls, charts, and tabular content."

  - name: "packaging_product_image"
    description: "Photorealistic packaging renders, variant systems, and consistent studio product visuals."
    priority: 10
    utterances:
      - "Generate studio pack shots for several variants with consistent containers, coded accents, and supporting imagery."
      - "Create realistic packaging renders with accurate materials, transparent areas, typography, and a clean background."
      - "Produce a coherent family image showing multiple variants with identical framing and lighting."
      - "Render commercial packaging photography with believable print finish, seams, labels, and construction details."

  - name: "packaging_copy"
    description: "On-pack copy, claims, stories, disclosures, recycling guidance, and calls to action."
    priority: 10
    utterances:
      - "Write complete packaging copy including name, tagline, short claim, story, contents, warnings, disposal guidance, and a code prompt."
      - "Create compliant front- and back-of-pack language with placeholders for required information."
      - "Develop a packaging copy system with concise claims, scan-code messaging, and consumer-safe instructions."
      - "Draft polished on-pack language that balances voice, clarity, hierarchy, and disclosure requirements."

  - name: "editorial_layout_image"
    description: "Image-led print layouts, double-page spreads, posters, and premium editorial compositions."
    priority: 10
    utterances:
      - "Create a double-page editorial concept with full-bleed photography, a short manifesto, details, and identity marks."
      - "Design a premium print spread balancing cinematic imagery with structured copy and supporting information."
      - "Produce a publication layout with disciplined grids, editorial photography, headline hierarchy, and callouts."
      - "Generate image-plus-copy collateral with a refined broadsheet or poster composition."

  - name: "educational_diagram_image"
    description: "Technical and educational diagrams with sequential steps and learner-friendly structure."
    priority: 10
    utterances:
      - "Create a clean educational diagram explaining a multi-stage process with labeled steps and connections."
      - "Generate a learner-friendly technical visual with layers, arrows, annotations, and a white background."
      - "Design a visual explanation for an abstract system using clear sequencing, accessible labels, and simple icons."
      - "Produce an instructional infographic that makes a complex mechanism understandable to a younger audience."

  - name: "lightweight_microlearning"
    description: "Short, accessible learning scripts requiring clarity, speed, and modest complexity."
    priority: 8
    utterances:
      - "Write a brief peer-level learning script using a familiar analogy, visual cues, and a final quiz question."
      - "Create a concise micro-lesson for younger learners with friendly narration and simple on-screen graphics."
      - "Explain one foundational concept in under two minutes without condescension or unnecessary complexity."
      - "Draft a lightweight educational voice-over with a relatable example and comprehension check."

  - name: "virtual_staging_image"
    description: "Virtual furnishing and environmental staging with architectural preservation and disclosure."
    priority: 10
    utterances:
      - "Virtually furnish an empty interior in a defined style and support a transparent descriptive caption."
      - "Stage a vacant room with period-appropriate objects, natural light, and realistic proportions."
      - "Generate a presentation-ready interior visualization while preserving architecture and avoiding misleading alterations."
      - "Create virtual spatial staging plus context that clearly discloses digital modification."

  - name: "multilingual_premium_content"
    description: "High-quality multilingual scripts and public messages requiring natural cadence and terminology."
    priority: 10
    utterances:
      - "Write an energetic timed voice-over in several languages with synchronized moment cues."
      - "Create short public advisories in multiple languages at a specified reading level without borrowed terminology."
      - "Adapt one communication into several languages while preserving intent, tone, and natural spoken rhythm."
      - "Produce multilingual operational messages with strict length limits and culturally appropriate terminology."
      - "Write concise advisory alerts in four languages with a reading-level target, character limit, and no foreign loanwords."
      - "Generate short multilingual notices across several topics while preserving native terminology and simple literacy."

  - name: "private_document_processing"
    description: "Sensitive document transformation constrained to private or on-premises infrastructure."
    priority: 10
    utterances:
      - "Summarize a long sensitive document into plain language without sending data outside private infrastructure."
      - "Process confidential source material using an on-premises model and produce an accessible explanation."
      - "Transform internal content under strict data-residency and no-egress requirements."
      - "Analyze private records with a locally hosted model and return a structured plain-language output."

  - name: "bulk_low_cost_generation"
    description: "Very high-volume, low-cost generation of short templates, titles, alerts, and snippets."
    priority: 9
    utterances:
      - "Generate hundreds of short templates across several reasons, recipient tiers, and locales under a strict budget."
      - "Create hundreds of thousands of concise search-aware titles with a fixed field order and character cap."
      - "Produce a large batch of operational messages using dynamic fields while minimizing total generation cost."
      - "Generate high-volume short-form variants with predictable formatting, high throughput, and economical inference."

  - name: "legal_document_analysis"
    description: "Complex contractual, policy, and formal-document analysis requiring defensible risk extraction."
    priority: 10
    utterances:
      - "Summarize major obligations, liability limits, and exit provisions into a plain-language risk table and flag deviations."
      - "Analyze a lengthy formal request, extract mandatory requirements, map capabilities, and identify gaps."
      - "Review contractual clauses against common norms and produce a structured risk overview."
      - "Extract obligations, deadlines, evidence, exceptions, and response actions from a long formal document."

  - name: "consistent_character_image"
    description: "Multi-image character sheets and variation sets requiring consistent visual identity."
    priority: 10
    utterances:
      - "Generate a series of character sheets with varied bodies and features but one consistent art system."
      - "Create many character variants while preserving line weight, palette, rendering style, and sheet layout."
      - "Produce a cohesive concept-art set with controlled variation across appearance, affiliation, and physical traits."
      - "Design repeatable character assets suited to fine-tuned or consistency-focused image generation."

  - name: "inclusive_beauty_image"
    description: "Inclusive human imagery requiring faithful skin-tone rendering and responsible representation."
    priority: 10
    utterances:
      - "Create a campaign visual showing a broad shade range on diverse skin tones without lightening artifacts."
      - "Generate inclusive human imagery where complexion accuracy, undertones, and equitable lighting are essential."
      - "Produce a shade-system visual with many people, faithful color rendering, and concise inclusive copy."
      - "Design responsible promotional artwork with authentic representation and accurate tonal variation."

  - name: "final_audio_or_video_orchestration"
    description: "Rendered final audio or video requests when no configured model supports that modality."
    priority: 10
    utterances:
      - "Deliver a finished audio track with a specific voice, speaking rate, pauses, ambient bed, and mix level."
      - "Generate a final cinematic video clip with camera motion, shallow focus, moving light, and particles."
      - "Render production-ready audio rather than only a script or sound-design brief."
      - "Create an actual motion sequence or playable video file rather than a storyboard."

  - name: "typography_and_poster_image"
    description: "Typography-heavy posters, exact headlines, logos, codes, and text-critical visual assets."
    priority: 10
    utterances:
      - "Design a poster with an exact headline, date block, identity placeholders, and a reserved scannable-code area."
      - "Create a text-heavy promotional graphic where every word must render clearly and accurately."
      - "Produce a poster with strict typographic hierarchy, exact copy, marks, and code placement."
      - "Generate an announcement graphic prioritizing legible text and precise layout."

  - name: "real_time_customer_assistant"
    description: "Low-latency live assistants handling routine intents with explicit high-risk escalation."
    priority: 10
    utterances:
      - "Power a live service chat with sub-second response latency for routine requests and risk escalation."
      - "Design responses for a real-time assistant that must meet a strict percentile latency target."
      - "Handle simple conversational operations quickly while escalating suspected abuse or sensitive actions."
      - "Provide low-latency support for common questions with explicit human-handoff rules."

  - name: "clarification_required"
    description: "Underspecified requests that must gather requirements before generation."
    priority: 10
    utterances:
      - "Make something professional without specifying the format, audience, dimensions, source assets, or deliverable."
      - "Refresh the creative direction but no channel, goal, constraints, or intended users are provided."
      - "Create a polished asset when the requested medium and acceptance criteria are missing."
      - "Help with a redesign using an ambiguous brief that requires targeted clarification questions first."

  - name: "reference_conditioned_brand_image"
    description: "Imagery requiring close adherence to supplied references and proprietary geometry."
    priority: 10
    utterances:
      - "Generate new imagery that preserves exact hardware, stitching, silhouette, and structural details from references."
      - "Create new visuals while maintaining high fidelity to a supplied multi-angle reference set."
      - "Render a proprietary object in new scenes without changing its construction, proportions, or signature details."
      - "Produce reference-conditioned images with strict identity and geometry consistency."

  - name: "accessible_visual_explainer"
    description: "Accessible diagrams requiring sufficient contrast, non-color encoding, and text alternatives."
    priority: 10
    utterances:
      - "Create an accessible educational diagram with AA contrast, colorblind-safe encoding, alt text, and a text summary."
      - "Design an inclusive visual explanation that never relies on color alone and includes screen-reader content."
      - "Generate a labeled instructional graphic with accessible contrast, patterns or shapes, and complete alternative text."
      - "Produce a technical diagram plus a logical reading order and equivalent plain-language description."

  - name: "large_scale_localization"
    description: "Large multilingual corpus localization requiring long context and terminology consistency."
    priority: 10
    utterances:
      - "Localize hundreds of technical articles into many languages while preserving accuracy and approved terminology."
      - "Translate a large knowledge corpus across more than ten locales with glossary and tone consistency."
      - "Adapt extensive support documentation for global audiences with terminology quality assurance."
      - "Process high-volume multilingual content using long context and consistent vocabulary."

  - name: "safety_and_claims_review"
    description: "Requests involving protected third-party material, unverified claims, or potentially misleading comparisons."
    priority: 10
    utterances:
      - "Create comparative promotional material using protected third-party identity elements and an unverified superiority claim."
      - "Review a proposed comparison for intellectual-property, substantiation, fair-comparison, and disclosure risks."
      - "Provide a compliant alternative to content that imitates protected visual identity or asserts unsupported performance."
      - "Assess promotional content that combines third-party intellectual property with regulated or evidence-sensitive claims."

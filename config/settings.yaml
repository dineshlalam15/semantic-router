# Application & Routing Settings

encoder:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32

routing:
  # Default model selection strategy: 'quality', 'cost', 'latency', 'priority', or 'balanced'
  default_selection_strategy: "quality"
  balanced_weights:
    quality: 0.50
    cost: 0.25
    latency: 0.25

server:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

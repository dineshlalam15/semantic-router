# Models Configuration
# Maps LLM models to supported domains and capabilities.
# Note: Providers and models are metadata only. No external provider API calls are made.

models:
  # Anthropic Models
  - provider: "Anthropic"
    model_name: "claude-3-5-sonnet-20241022"
    domains:
      - "software_engineering"
      - "legal_document_analysis"
    capabilities:
      - "coding"
      - "complex_reasoning"
      - "document_analysis"

  - provider: "Anthropic"
    model_name: "claude-3-5-haiku-20241022"
    domains:
      - "general_everyday_chat"
      - "content_marketing"
    capabilities:
      - "fast_inference"
      - "conversational"
      - "creative_writing"

  # OpenAI Models
  - provider: "OpenAI"
    model_name: "o1"
    domains:
      - "stem_mathematics"
    capabilities:
      - "deep_reasoning"
      - "mathematics"

  - provider: "OpenAI"
    model_name: "gpt-4o"
    domains:
      - "content_marketing"
      - "software_engineering"
    capabilities:
      - "multimodal"
      - "coding"
      - "creative_writing"

  - provider: "OpenAI"
    model_name: "dall-e-3"
    domains:
      - "image_generation"
    capabilities:
      - "image_generation"
      - "photorealism"

  # Gemini Models
  - provider: "Gemini"
    model_name: "gemini-1.5-pro"
    domains:
      - "legal_document_analysis"
    capabilities:
      - "ultra_long_context"
      - "document_analysis"

  - provider: "Gemini"
    model_name: "gemini-1.5-flash"
    domains:
      - "general_everyday_chat"
    capabilities:
      - "fast_inference"
      - "conversational"

  # LiteLLM Models
  - provider: "LiteLLM"
    model_name: "deepseek-r1"
    domains:
      - "stem_mathematics"
    capabilities:
      - "open_weights_reasoning"
      - "mathematics"

  - provider: "LiteLLM"
    model_name: "qwen-2.5-coder-32b"
    domains:
      - "software_engineering"
    capabilities:
      - "code_generation"
      - "refactoring"

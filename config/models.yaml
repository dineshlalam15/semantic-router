# Models Configuration
# Defines available LLM models across providers, their supported domains, capabilities,
# and operational metadata for selection strategies.
# Note: Providers and models are metadata only. No external provider API calls are made.

models:
  # Anthropic Models
  - provider: "Anthropic"
    model_name: "claude-3-5-sonnet-20241022"
    domains:
      - "software_engineering"
      - "stem_mathematics"
      - "legal_document_analysis"
    capabilities:
      - "coding"
      - "complex_reasoning"
      - "document_analysis"
      - "tool_use"
    metadata:
      context_window: 200000
      input_cost_per_m: 3.00
      output_cost_per_m: 15.00
      latency_p90_ms: 1200
      reasoning_capability: 9.8
      coding_capability: 9.9
      vision_capability: true
      tool_use: true
      availability: 0.999
      priority: 10

  - provider: "Anthropic"
    model_name: "claude-3-5-haiku-20241022"

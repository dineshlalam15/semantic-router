# Text model registry for production semantic routing.
# Providers: Anthropic, OpenAI, Gemini, LiteLLM.
# Capabilities are domain-agnostic, task-focused, and free of industry-specific entities.

models:
  # ── ANTHROPIC ──

  - provider: "Anthropic"
    model_name: "claude-haiku-4-5-20251001"
    domains:
      - "clarification_required"
      - "lightweight_microlearning"
      - "real_time_customer_assistant"
      - "structured_catalog_generation"
    capabilities:
      - "concise educational scripts"
      - "clear short-form writing"
      - "low-latency generation"
      - "fast accessible explanations"
      - "requirements clarification triage"
    metadata:
      modality: "text"
      cost_per_1k_input_tokens: 0.0008
      cost_per_1k_output_tokens: 0.004
      avg_latency_ms: 600
      context_window_k: 200


# Text Models Configuration: Best-in-market LLM models for marketing content, copy, and research.
# Providers: Anthropic, OpenAI, Gemini, LiteLLM.
# Metadata: cost (USD per 1K tokens), avg_latency_ms, context_window_k tokens.

models:

  - provider: "Anthropic"
    model_name: "claude-haiku-4-5-20251001"
    domains:
      - "campaign_and_advertising_copy"
      - "email_marketing_and_retention"
      - "social_media_and_brand_storytelling"
    capabilities:
      - "fast_inference"
      - "conversational"
      - "creative_writing"
      - "ad_copy"
    metadata:
      cost_per_1k_input_tokens: 0.0008
      cost_per_1k_output_tokens: 0.004
      avg_latency_ms: 600
      context_window_k: 200

  - provider: "Anthropic"
